# OpenVPN server (lab example). Generate certificates with easy-rsa; never commit keys.
port 1194
proto udp
dev tun
ca   ca.crt
cert server.crt
key  server.key
dh   none
ecdh-curve prime256v1
tls-crypt ta.key
server 10.8.0.0 255.255.255.0
push "route 10.10.10.0 255.255.255.0"   # servers only, least privilege
cipher AES-256-GCM
auth SHA256
tls-version-min 1.2
keepalive 10 60
user nobody
group nogroup
persist-key
persist-tun
status /var/log/openvpn-status.log
log-append /var/log/openvpn.log
verb 3
